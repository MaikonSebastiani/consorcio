<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{meta}}
{{estilo}}
<style>
  .topo { position: relative; z-index: 2; max-width: 1080px; height: 72px; margin: 0 auto; padding: 0 16px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  #app { max-width: 1080px; margin: 0 auto; padding: 8px 16px 0; }
  .pagina > :not(.capa) { width: min(1048px, 100% - 32px); margin-inline: auto; }
  #app.estreito { max-width: 560px; }
  .topo-nav { display: flex; gap: 20px; font-size: .88rem; font-weight: 700; }
  .topo-nav a { color: var(--suave); text-decoration: none; }
  .topo-nav a:hover { color: var(--tinta); }
  .barra-cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px 16px; background: var(--fundo); border-top: 1px solid var(--linha); }
  .consentimento a { color: var(--ouro-claro); }

  .capa { position: relative; margin-top: -72px; padding: 112px 0 56px; }
  .capa::before { content: ""; position: absolute; inset: 0; background: right center / cover no-repeat; opacity: .38; }
  .capa-carro::before { background-image: url(/img/hero-carro.webp); }
  .capa-imovel::before { background-image: url(/img/hero-imovel.webp); }
  .capa::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--fundo) 0, transparent 22%), linear-gradient(90deg, var(--fundo) 0, transparent 55%); }
  .capa-grade { position: relative; z-index: 1; display: grid; grid-template-columns: 1.1fr .9fr; gap: 56px; align-items: center; width: min(1048px, 100% - 32px); margin: 0 auto; }
  .capa h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); margin: 14px 0 16px; }
  .capa .botao { max-width: 320px; margin-top: 24px; }
  .provas { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 8px; color: #d6d7da; font-size: .92rem; }
  .provas li { display: flex; gap: 10px; align-items: baseline; }
  .provas li::before { content: "◆"; flex: none; color: var(--ouro); font-size: .62rem; transform: translateY(-1px); }
  .previa-painel { display: grid; gap: 12px; padding: 16px; background: rgba(22, 24, 27, .06); border: 1px dashed var(--neutro); border-radius: 18px; }
  .previa-aviso { display: grid; gap: 8px; justify-items: start; margin-bottom: 4px; }
  .selo-exemplo { background: var(--ouro); color: #1a1710; font-size: .74rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; }
  .passos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .passos .cartao span { color: var(--ouro); font-weight: 800; font-size: .84rem; }
  .passos h3 { margin: 4px 0; }

  .progresso { height: 4px; background: var(--painel-alto); border-radius: 4px; overflow: hidden; margin: 12px 0 28px; }
  .progresso div { height: 100%; background: var(--ouro); transition: width .25s; }
  .estreito h2 { font-size: 1.6rem; margin-bottom: 20px; }
  .opcao { display: block; width: 100%; text-align: left; background: var(--painel); border: 1px solid var(--linha); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; font-weight: 700; cursor: pointer; transition: border-color .15s, background .15s; }
  .opcao:hover { border-color: var(--ouro); background: var(--painel-alto); }
  .opcao:active { transform: scale(.98); }
  .valor-grande { font-size: 2.6rem; font-weight: 800; letter-spacing: -.03em; color: var(--ouro-claro); margin: 8px 0; font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 4px 0 10px; background: transparent; --pct: 50%; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--ouro) var(--pct), var(--painel-alto) var(--pct)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -12px; border-radius: 50%; background: var(--ouro-claro); border: 4px solid var(--ouro); box-shadow: 0 2px 10px rgba(0, 0, 0, .45); }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 6px; background: var(--painel-alto); }
  input[type=range]::-moz-range-progress { height: 6px; border-radius: 6px; background: var(--ouro); }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--ouro-claro); border: 4px solid var(--ouro); }
  .atalhos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
  .atalhos button { min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--linha); background: var(--painel); font-weight: 700; font-size: .9rem; cursor: pointer; }
  .atalhos button[aria-pressed=true] { border-color: var(--ouro); background: var(--ouro-fundo); color: var(--ouro-claro); }
  .atalhos button:active { transform: scale(.97); }
  body.simulando .rodape { display: none; }
  .voltar { display: block; width: 100%; background: none; border: 0; color: var(--suave); padding: 14px; cursor: pointer; font-size: .92rem; }
  .voltar:hover { color: var(--tinta); }

  label { display: block; font-weight: 700; font-size: .92rem; margin-bottom: 14px; }
  input[type=text], input[type=tel] { width: 100%; margin-top: 6px; padding: 14px; border: 1px solid var(--linha); border-radius: 10px; background: var(--painel); }
  .consentimento { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; font-size: .84rem; color: var(--suave); }
  .consentimento input { margin-top: 3px; width: 18px; height: 18px; flex: none; accent-color: var(--ouro); }
  .isca { position: absolute; left: -9999px; }
  .borrado { filter: blur(7px); user-select: none; font-size: 2rem; font-weight: 800; color: var(--ouro-claro); }
  .previa-plano { margin-bottom: 20px; }

  .painel-topo { margin: 12px 0 20px; }
  .painel-topo h2 { font-size: clamp(1.6rem, 4vw, 2.2rem); margin-top: 6px; }
  .painel { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; margin-top: 12px; }
  .metade { grid-column: span 6; }
  .sete { grid-column: span 7; }
  .cinco { grid-column: span 5; }
  .inteiro { grid-column: span 12; }
  .tabela-plano { margin-top: 18px; }
  .perda { color: var(--ouro-claro); font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; margin: 6px 0; }
  .estrategia { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .estrategia ol { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 8px; }
  .estrategia li::marker { color: var(--ouro); font-weight: 800; }
  .estrategia .perda { font-size: 1.4rem; }
  .media { display: inline-block; margin: 6px 0 10px; padding: 6px 12px; border-radius: 8px; background: var(--ouro-fundo); border: 1px solid #6b5a30; color: var(--ouro-claro); font-weight: 800; font-size: .92rem; }
  .confirmacao { border-color: #4d7363; }
  .confirmacao h3 { color: var(--salvia); }
  .legal { margin-top: 16px; }

  @media (min-width: 821px) { .barra-cta { display: none; } }
  @media (max-width: 820px) {
    .topo-nav { display: none; }
    body.com-barra .rodape { padding-bottom: 72px; }
    .capa { padding: 150px 0 40px; }
    .capa::before { background-size: auto 340px; background-position: right top; opacity: .5; }
    .capa-carro::before { background-image: url(/img/hero-carro-celular.webp); }
    .capa-imovel::before { background-image: url(/img/hero-imovel-celular.webp); }
    .capa::after { background: linear-gradient(180deg, transparent 0, transparent 150px, var(--fundo) 330px); }
    .capa-grade { grid-template-columns: minmax(0, 1fr); gap: 32px; }
    .capa .botao { max-width: none; }
    .passos { grid-template-columns: 1fr; }
    .metade, .sete, .cinco { grid-column: span 12; }
    .estrategia { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .pagina > .passos { width: auto; margin-inline: 0; }
    .atalhos { grid-template-columns: 1fr 1fr; }
    #app .indicadores { grid-template-columns: 1fr 1fr; gap: 8px; }
    #app .indicador { padding: 12px 14px; }
    #app .indicador .valor { font-size: 1.25rem; }
    #app .indicador .nota { font-size: .74rem; }
    .painel-topo h2 { font-size: 1.5rem; }
    .perda { font-size: 1.4rem; }
  }
</style>
</head>
<body>
{{aviso}}
<header class="topo">
  <a class="logo" href="/">{{logoMarca}}<span>{{marca}}</span></a>
  <nav class="topo-nav" id="navegacao" aria-label="Nesta página">
    <a href="#como-funciona">Como funciona</a>
    <a href="#lance">Lance</a>
    <a href="#comparativo">Comparativo</a>
    <a href="#duvidas">Dúvidas</a>
  </nav>
  <span class="pequeno suave">Consultoria em consórcio</span>
</header>
<main class="pagina" id="pagina">
{{conteudo}}
</main>
<div id="app" hidden></div>
{{rodape}}
<div class="barra-cta" id="barraCta" hidden><button class="botao" data-simular>Simular agora</button></div>

{{scripts}}
<script type="module">import { cartaIndicada, erroCelular } from "/regras.mjs"; Object.assign(window, { cartaIndicada, erroCelular });</script>
<script>
const app = document.getElementById("app");
const pagina = document.getElementById("pagina");
const barraCta = document.getElementById("barraCta");
const respostas = {};
const lead = {};


const PRODUTOS = {
  carro: {
    bem: "Carro",
    exemplo: 90000,
    exemploTexto: "um carro",
    quandoRecebe: "Quando pega o carro",
    quandoFinanciamento: entrada => `Na hora, com ${entrada} de entrada`,
    aviso: "",
    passos: [
      { id: "motivo", titulo: "O que você quer fazer?", opcoes: [
        ["comprar meu primeiro carro", "Comprar meu primeiro carro"],
        ["trocar de carro", "Trocar de carro"],
        ["ter um carro para trabalhar", "Ter um carro para trabalhar"],
        ["comprar um carro para a família", "Comprar um carro para a família"],
      ]},
      { id: "valor", titulo: "Quanto custa o carro que você quer?", min: 40000, max: 300000, passo: 5000, inicial: 90000, atalhos: [60000, 90000, 120000, 180000] },
      { id: "parcela", titulo: "Quanto cabe no seu mês, sem apertar?", min: 300, max: 5000, passo: 50, inicial: 1000, atalhos: [800, 1200, 1800, 2500] },
      { id: "reserva", titulo: "Você tem algum valor guardado para dar de lance?", opcoes: [
        ["nenhum", "Ainda não tenho"],
        ["até 10% do carro", "Até 10% do valor do carro"],
        ["de 10% a 30% do carro", "De 10% a 30%"],
        ["mais de 30% do carro", "Mais de 30%"],
      ]},
    ],
  },
  imovel: {
    bem: "Imóvel",
    exemplo: 350000,
    exemploTexto: "um imóvel",
    quandoRecebe: "Quando pega o imóvel",
    quandoFinanciamento: entrada => `Após aprovação do banco, com ${entrada} de entrada`,
    aviso: " No imóvel, parcela e crédito são reajustados por índice.",
    passos: [
      { id: "motivo", titulo: "O que você quer fazer?", opcoes: [
        ["sair do aluguel", "Sair do aluguel"],
        ["comprar meu primeiro imóvel", "Comprar meu primeiro imóvel"],
        ["investir em imóvel", "Investir em imóvel"],
        ["construir minha casa", "Construir minha casa"],
      ]},
      { id: "valor", titulo: "Quanto custa o imóvel que você quer?", min: 150000, max: 1500000, passo: 10000, inicial: 350000, atalhos: [250000, 350000, 500000, 800000] },
      { id: "parcela", titulo: "Quanto cabe no seu mês, sem apertar?", min: 500, max: 15000, passo: 100, inicial: 2000, atalhos: [1500, 2500, 4000, 6000] },
      { id: "aluguel", titulo: "Quanto você paga de aluguel hoje?", min: 0, max: 10000, passo: 100, inicial: 1500, zero: "Não pago aluguel", atalhos: [0, 1000, 2000, 3500] },
      { id: "reserva", titulo: "Você tem algum valor guardado para dar de lance?", opcoes: [
        ["nenhum", "Ainda não tenho"],
        ["até 10% do imóvel", "Até 10% do valor do imóvel"],
        ["de 10% a 30% do imóvel", "De 10% a 30%"],
        ["mais de 30% do imóvel", "Mais de 30%"],
      ]},
    ],
  },
};

const produto = location.pathname.startsWith("/imovel") ? "imovel" : "carro";
const P = PRODUTOS[produto];
const dados = CONFIG[produto];
const passos = P.passos;

function calcular(valor, parcela) {
  const { consorcio: c, financiamento: f } = dados;
  const fator = 1 + c.taxaAdministracao + c.fundoReserva;
  const totalConsorcio = valor * fator;
  const parcelaConsorcio = totalConsorcio / c.prazoMeses;
  const financiado = valor * (1 - f.entrada);
  const parcelaFin = financiado * f.jurosMensal / (1 - Math.pow(1 + f.jurosMensal, -f.prazoMeses));
  const totalFin = valor * f.entrada + parcelaFin * f.prazoMeses;
  return {
    totalConsorcio, parcelaConsorcio, parcelaFin, totalFin,
    economia: totalFin - totalConsorcio,
    jurosFin: totalFin - valor,
    taxasConsorcio: totalConsorcio - valor,
    creditoQueCabe: Math.floor(parcela * c.prazoMeses / fator / 1000) * 1000,
  };
}

function barrasCusto(r) {
  return barras([
    { rotulo: "Consórcio", valor: r.totalConsorcio, texto: reais(r.totalConsorcio), detalhe: `Consórcio: ${reais(r.taxasConsorcio)} em taxas estimadas` },
    { rotulo: "Financiamento", valor: r.totalFin, texto: reais(r.totalFin), detalhe: `Financiamento: ${reais(r.jurosFin)} em juros estimados`, neutra: true },
  ]);
}

function mostrarSimulacao() {
  document.body.classList.add("simulando");
  pagina.hidden = true;
  document.getElementById("navegacao").hidden = true;
  barraCta.hidden = true;
  app.hidden = false;
}

function mostrarPagina() {
  document.body.classList.remove("simulando");
  app.hidden = true;
  pagina.hidden = false;
  document.getElementById("navegacao").hidden = false;
  window.scrollTo(0, 0);
}

function iniciarSimulacao() {
  history.pushState({ simulacao: true }, "");
  telaPasso(0);
}

function iniciarPagina() {
  const r = calcular(P.exemplo, 0);
  const custo = el("div", "cartao");
  custo.append(el("h3", "", "Custo total estimado"), barrasCusto(r));
  const numeros = el("div", "indicadores");
  numeros.append(indicador("Parcela estimada", reais(r.parcelaConsorcio), `${reais(r.economia)} a menos que no financiamento`, true));
  const aviso = el("div", "previa-aviso");
  aviso.append(el("span", "selo-exemplo", "Exemplo de simulação"), el("p", "pequeno suave", `Valores ilustrativos para ${P.exemploTexto} de ${reais(P.exemplo)}. Os seus aparecem depois das perguntas.`));
  document.getElementById("previa").append(aviso, numeros, custo);

  document.querySelectorAll("[data-simular]").forEach(b => { b.onclick = iniciarSimulacao; });
  window.onpopstate = mostrarPagina;

  // No celular, mantém um botão de simulação visível depois que a chamada principal sai da tela.
  new IntersectionObserver(([entrada]) => {
    barraCta.hidden = entrada.isIntersecting || pagina.hidden;
    document.body.classList.toggle("com-barra", !barraCta.hidden);
  }).observe(document.querySelector(".capa [data-simular]"));
}

function barraProgresso(indice) {
  const barra = el("div", "progresso");
  const preenchido = el("div");
  preenchido.style.width = `${(indice + 1) / (passos.length + 1) * 100}%`;
  barra.append(preenchido);
  return barra;
}

function telaPasso(indice) {
  if (indice >= passos.length) return telaContato();
  mostrarSimulacao();
  app.className = "estreito";
  const passo = passos[indice];
  const avancar = () => telaPasso(indice + 1);
  app.replaceChildren(el("div", "pequeno suave", `Pergunta ${indice + 1} de ${passos.length}`), barraProgresso(indice), el("h2", "", passo.titulo));

  if (passo.opcoes) {
    passo.opcoes.forEach(([valor, texto]) => {
      const opcao = el("button", "opcao", texto);
      opcao.onclick = () => { respostas[passo.id] = valor; avancar(); };
      app.append(opcao);
    });
  } else {
    const atual = respostas[passo.id] ?? passo.inicial;
    const formatar = v => (v === 0 && passo.zero) || reais(v);
    const mostrador = el("div", "valor-grande", formatar(atual));
    const faixa = el("input");
    Object.assign(faixa, { type: "range", min: passo.min, max: passo.max, step: passo.passo, value: atual });
    faixa.setAttribute("aria-label", passo.titulo);
    const atalhos = el("div", "atalhos");
    const atualizar = () => {
      const valor = Number(faixa.value);
      mostrador.textContent = formatar(valor);
      faixa.style.setProperty("--pct", `${(valor - passo.min) / (passo.max - passo.min) * 100}%`);
      atalhos.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", Number(b.value) === valor));
    };
    passo.atalhos.forEach(valor => {
      const atalho = el("button", "", formatar(valor));
      Object.assign(atalho, { type: "button", value: valor });
      atalho.onclick = () => { faixa.value = valor; atualizar(); };
      atalhos.append(atalho);
    });
    faixa.oninput = atualizar;
    const botao = el("button", "botao", "Continuar");
    botao.onclick = () => { respostas[passo.id] = Number(faixa.value); avancar(); };
    app.append(mostrador, faixa, atalhos, botao);
    atualizar();
  }

  const voltar = el("button", "voltar", "Voltar");
  voltar.onclick = () => (indice > 0 ? telaPasso(indice - 1) : history.back());
  app.append(voltar);
  window.scrollTo(0, 0);
}

function telaContato() {
  app.className = "estreito";
  app.replaceChildren(el("div", "pequeno suave", "Último passo"), barraProgresso(passos.length), el("h2", "", "Seu painel está pronto"));
  const previa = el("div", "cartao previa-plano");
  previa.append(el("div", "pequeno suave", "Parcela estimada"), el("div", "borrado", "R$ 0.000"));
  previa.lastChild.setAttribute("aria-hidden", "true");
  app.append(previa);

  const form = el("form");
  form.noValidate = true;
  const nomeRotulo = el("label", "", "Seu nome");
  const nome = el("input");
  Object.assign(nome, { type: "text", autocomplete: "given-name", autocapitalize: "words", enterKeyHint: "next" });
  nomeRotulo.append(nome);

  const foneRotulo = el("label", "", "Seu celular com WhatsApp");
  const fone = el("input");
  Object.assign(fone, { type: "tel", autocomplete: "tel", inputMode: "numeric", enterKeyHint: "done", placeholder: "(11) 91234-5678" });
  const digitosFone = () => fone.value.replace(/\D/g, "");
  const marcarFone = mensagem => {
    fone.setAttribute("aria-invalid", Boolean(mensagem));
    erro.textContent = mensagem;
  };
  fone.oninput = () => {
    const todos = digitosFone();
    // O preenchimento automático do celular costuma trazer o +55.
    const d = (todos.length > 11 && todos.startsWith("55") ? todos.slice(2) : todos).slice(0, 11);
    fone.value = d.length > 7 ? `(${d.slice(0, 2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}` : d.length > 2 ? `(${d.slice(0, 2)}) ${d.slice(2)}` : d;
    if (fone.getAttribute("aria-invalid") === "true" && !erroCelular(d)) marcarFone("");
  };
  fone.onblur = () => { if (fone.value) marcarFone(erroCelular(digitosFone())); };
  foneRotulo.append(fone);

  const consentRotulo = el("label", "consentimento");
  const consent = el("input");
  consent.type = "checkbox";
  const textoConsent = el("span", "", `Autorizo a equipe do ${CONFIG.marca} a falar comigo pelo WhatsApp sobre esta simulação. Posso pedir para sair a qualquer momento. `);
  const politica = el("a", "", "Política de privacidade");
  Object.assign(politica, { href: "/privacidade", target: "_blank", rel: "noopener" });
  textoConsent.append(politica);
  consentRotulo.append(consent, textoConsent);

  const erro = el("p", "erro");
  erro.setAttribute("role", "alert");
  const enviar = el("button", "botao", "Ver meu painel");
  enviar.type = "submit";

  const isca = el("input", "isca");
  Object.assign(isca, { type: "text", tabIndex: -1, autocomplete: "off" });
  isca.setAttribute("aria-hidden", "true");

  form.onsubmit = async e => {
    e.preventDefault();
    const digitos = digitosFone();
    if (nome.value.trim().length < 2) return void (erro.textContent = "Digite seu nome.");
    const problemaFone = erroCelular(digitos);
    if (problemaFone) {
      marcarFone(problemaFone);
      return fone.focus();
    }
    if (!consent.checked) return void (erro.textContent = "Marque a autorização para continuar.");
    lead.nome = nome.value.trim();
    lead.whatsapp = digitos;
    erro.textContent = "";
    enviar.disabled = true;
    enviar.textContent = "Enviando...";
    try {
      await enviarLead(isca.value);
      telaResultado();
    } catch (falha) {
      erro.textContent = falha.message;
      enviar.disabled = false;
      enviar.textContent = "Ver meu painel";
    }
  };
  form.append(isca, nomeRotulo, foneRotulo, consentRotulo, erro, enviar);
  app.append(form);
  window.scrollTo(0, 0);
}

async function enviarLead(site) {
  let resposta;
  try {
    resposta = await fetch("/api/leads", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...lead, ...respostas, objetivo: produto, consentimento: true, site }),
    });
  } catch {
    throw new Error("Sem conexão. Tente de novo.");
  }
  if (!resposta.ok) throw new Error((await resposta.json()).erro || "Não foi possível enviar. Tente de novo.");
}

function tabelaPlano(r, carta) {
  const { consorcio: c, financiamento: f } = dados;
  const tabela = el("table", "tabela-plano");
  const cabeca = el("thead");
  const titulos = el("tr");
  ["", "Consórcio", "Financiamento"].forEach(t => titulos.append(el("th", "", t)));
  cabeca.append(titulos);
  const corpo = el("tbody");
  [["Parcela", reais(r.parcelaConsorcio), reais(r.parcelaFin)],
   ["Prazo", `${c.prazoMeses} meses`, `${f.prazoMeses} meses`],
   [P.quandoRecebe, "Ao ser contemplado por sorteio ou lance", P.quandoFinanciamento(reais(carta * f.entrada))]].forEach(([rotulo, a, b]) => {
    const linha = el("tr");
    linha.append(el("th", "", rotulo), el("td", "", a), el("td", "", b));
    corpo.append(linha);
  });
  tabela.append(cabeca, corpo);
  return tabela;
}

function cartaoEstrategia(r, carta) {
  const plano = planoDeLance(produto, carta, respostas.reserva);
  const guardar = Math.ceil(r.parcelaConsorcio * 0.2 / 10) * 10;
  const passosLance = [
    plano.proprio
      ? `Lance livre de cerca de ${reais(plano.valorProprio)} da sua reserva.`
      : `Concorra no sorteio e guarde ${reais(guardar)} por mês para o lance.`,
    plano.embutido && `Até ${reais(plano.valorEmbutido)} de lance embutido, que sai da carta.`,
    "Concorra desde a primeira assembleia.",
    "Acompanhamos cada assembleia e ajustamos o lance com você.",
  ].filter(Boolean);

  const c = el("div", "cartao inteiro estrategia");
  const texto = el("div");
  const lista = el("ol");
  passosLance.forEach(p => lista.append(el("li", "", p)));
  texto.append(el("div", "sobretitulo", "Sua estratégia de lance"), el("div", "perda", plano.nome), ...(plano.media ? [el("div", "media", `Média de ${plano.media} até a contemplação nessa estratégia`)] : []), lista);

  const numeros = el("div");
  numeros.append(el("h3", "", "Lance que você pode montar"), el("p", "pequeno suave", plano.total ? `Cerca de ${reais(plano.valorTotal)} sobre a carta de ${reais(carta)}` : "Hoje a sua chance vem do sorteio"));
  numeros.append(barras([{ rotulo: "Seu lance possível", valor: plano.total * 100, texto: `${Math.round(plano.total * 100)}%`, detalhe: `Lance possível: ${Math.round(plano.total * 100)}% da carta` }]));
  numeros.append(el("p", "pequeno suave legal", "Estimativa. Nenhuma estratégia garante contemplação."));
  c.append(texto, numeros);
  return c;
}

function cartaoEspera(chances, carta) {
  const c = el("div", "cartao metade");
  c.append(el("h3", "", "O que você perde deixando para depois"));
  const { media } = planoDeLance(produto, carta, respostas.reserva);
  const textoChances = `Cada mês fora é uma assembleia sem concorrer. Em 1 ano, são ${chances} chances.`;
  const textoMedia = media && `Na sua estratégia, a média é de ${media}. Adiar 1 ano adia essa contagem.`;
  if (produto === "carro") {
    c.append(el("div", "perda", `${chances} chances a menos por ano`), el("p", "suave", textoChances), ...(textoMedia ? [el("p", "suave", textoMedia)] : []));
    return c;
  }
  const aluguelAno = (respostas.aluguel || 0) * 12;
  const alta = respostas.valor * dados.altaAnual;
  const partes = [aluguelAno && `${reais(aluguelAno)} de aluguel`, `${reais(alta)} de alta do imóvel, se subir ${Math.round(dados.altaAnual * 100)}% no ano`].filter(Boolean);
  c.append(el("div", "perda", `${chances} chances e ${reais(aluguelAno + alta)} a menos`), el("p", "suave", textoChances), ...(textoMedia ? [el("p", "suave", textoMedia)] : []), el("p", "suave", `Em 12 meses: ${partes.join(" e ")}.`));
  return c;
}

function telaResultado() {
  document.body.classList.remove("simulando");
  app.className = "";
  const carta = cartaIndicada(dados.cartas, respostas.valor);
  const r = calcular(carta, respostas.parcela);
  const cabe = respostas.parcela >= r.parcelaConsorcio;
  const chances = dados.assembleiasPorAno;

  const topo = el("div", "painel-topo");
  topo.append(el("div", "sobretitulo", "Seu painel"), el("h2", "", `${lead.nome}, este é o seu plano`),
    el("p", "suave", `Carta de ${reais(carta)} para ${P.exemploTexto} de ${reais(respostas.valor)}`));

  const numeros = el("div", "indicadores");
  numeros.append(
    indicador("Economia estimada", r.economia > 0 ? reais(r.economia) : "Custos próximos", r.economia > 0 ? "a menos que no financiamento" : "em relação ao financiamento", "ganho"),
    indicador("Carta indicada", reais(carta), carta >= respostas.valor ? `Cobre o valor de ${reais(respostas.valor)}` : `Maior carta disponível para ${reais(respostas.valor)}`),
    indicador("Parcela estimada", reais(r.parcelaConsorcio), cabe ? `Cabe no seu limite de ${reais(respostas.parcela)}` : "Há condições para ajustar ao seu orçamento"),
    indicador("Juros que você evita", reais(r.jurosFin), `No consórcio, as taxas estimadas são de ${reais(r.taxasConsorcio)}`),
  );

  const painel = el("div", "painel");
  const comparativo = el("div", "cartao inteiro");
  comparativo.append(el("h3", "", "Consórcio ou financiamento?"), el("p", "pequeno suave", `Custo total estimado para a carta de ${reais(carta)}`), barrasCusto(r), tabelaPlano(r, carta));
  painel.append(comparativo, cartaoEstrategia(r, carta));

  const espera = cartaoEspera(chances, carta);

  const proximo = el("div", "cartao metade confirmacao");
  proximo.append(
    el("h3", "", "Recebemos seu plano"),
    el("p", "suave", cabe
      ? "Vamos chamar você no WhatsApp para mostrar como começar pagando ainda menos até a contemplação."
      : "Essa é a parcela cheia. Vamos chamar você no WhatsApp para mostrar como começar com uma parcela que caiba no seu orçamento."),
  );
  painel.append(espera, proximo);

  app.replaceChildren(topo, numeros, painel, el("p", "pequeno suave legal", `Valores estimados, sem seguro e sem reajustes. Contemplação sem data garantida. Condições confirmadas no contrato da ${CONFIG.administradora}.${P.aviso}`));
  window.scrollTo(0, 0);
}

iniciarPagina();
</script>
